# XDoG sigma=0.28 only, no Canny, no mixing
# HW4 techniques: CFG dropout, edge cycle loss, contrastive loss, timestep edge weighting
data:
  dataset: celeba
  root: "/data/celeba"
  from_hub: true
  repo_name: "electronickale/cmu-10799-celeba64-subset"
  image_size: 64
  channels: 3
  num_workers: 2
  pin_memory: true
  augment: true
  conditional: true
  edge_method: xdog
  edge_mix_xdog_sigma: 0.28

model:
  in_channels: 3
  conditioning_mode: edge_adapter
  condition_channels: 3
  edge_adapter_hidden_channels: 64
  base_channels: 128
  channel_mult: [1, 2, 2, 4]
  num_res_blocks: 2
  attention_resolutions: [16, 8]
  num_heads: 4
  dropout: 0.1
  use_scale_shift_norm: true

training:
  batch_size: 32
  learning_rate: 0.0002
  weight_decay: 0.01
  betas: [0.9, 0.999]
  ema_decay: 0.9999
  ema_start: 2000
  gradient_clip_norm: 1.0
  num_iterations: 90000
  log_every: 100
  sample_every: 2000
  save_every: 5000
  num_samples: 16

flow_matching:
  num_timesteps: 1000
  enable_timestep_edge_weighting: true
  edge_weight_power: 1.0
  condition_dropout_prob: 0.12
  edge_cycle_loss_weight: 0.10
  contrastive_loss_weight: 0.05
  contrastive_margin: 0.02
  cfg_guidance_scale: 2.5
  cfg_zero_steps: 8

sampling:
  num_steps: 50

infrastructure:
  seed: 42
  device: cuda
  num_gpus: 2
  mixed_precision: false
  compile_model: false

checkpoint:
  dir: "./checkpoints"
  resume: null

logging:
  dir: "./logs"
  wandb:
    enabled: true
    project: "cmu-10799-hw4"
    entity: null
